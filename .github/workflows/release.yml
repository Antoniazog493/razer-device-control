name: Release

# Push a tag like v0.2.0 to build rzr.exe and open a draft release with it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/rzr.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  rzr.exe" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" target/release/rzr.exe SHA256SUMS.txt `
            --draft --title "rzr ${{ github.ref_name }}" `
            --notes "See CHANGELOG.md for what changed. Checksums in SHA256SUMS.txt."
