name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update stable && rustup default stable

      # Same checks CONTRIBUTING.md asks for before every push.
      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Check page scripts
        run: node --check ui/app.js && node --check ui/demo.js

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Upload rzr.exe
        uses: actions/upload-artifact@v4
        with:
          name: rzr-windows
          path: target/release/rzr.exe
