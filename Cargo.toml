[package]
name = "rzr"
version = "0.2.0"
edition = "2021"
description = "Razer BlackShark V2 Pro control panel — replaces Razer Synapse for headset settings"
license = "MIT"

[dependencies]
# Panel: a web page (ui/) in the system WebView (WebView2 on Windows).
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
hidapi = "2.6"
winreg = "0.55"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Non-Windows builds exist for development; pure-Rust hidraw backend and
# WebKitGTK (libwebkit2gtk-4.1-dev) for the panel, on X11.
[target.'cfg(not(windows))'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview", "x11"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
